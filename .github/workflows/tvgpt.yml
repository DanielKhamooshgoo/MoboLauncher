name: tvgpt - Android 12 release validation

on:
  workflow_dispatch:
  push:
    branches:
      - tvgpt

permissions:
  contents: read

concurrency:
  group: tvgpt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APKs and install on Android 12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build both APK variants
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Validate APK structure, application IDs and signatures
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p reports
          for ITEM in "std:app/build/outputs/apk/std/debug/app-std-debug.apk:app.mobolauncher" "home:app/build/outputs/apk/home/debug/app-home-debug.apk:app.mobolauncher.home"; do
            IFS=: read -r FLAVOR APK EXPECTED_PACKAGE <<< "$ITEM"
            test -s "$APK"
            echo "Validating $FLAVOR APK: $APK"
            file "$APK" | tee -a reports/apk-files.txt
            sha256sum "$APK" | tee -a reports/apk-sha256.txt
            unzip -t "$APK" | tail -n 1
            "$BT/aapt" dump badging "$APK" | tee "reports/$FLAVOR-badging.txt"
            grep -Fq "package: name='$EXPECTED_PACKAGE'" "reports/$FLAVOR-badging.txt"
            "$BT/zipalign" -c -v 4 "$APK"
            "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "reports/$FLAVOR-signature.txt"
          done

      - name: Install and launch Home flavor on Android 12 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # This action launches each script line in a separate /bin/sh process.
          # Keep the whole test in one nested shell so variables and set -e persist.
          script: |
            sh -c 'set -eu; APK="$GITHUB_WORKSPACE/app/build/outputs/apk/home/debug/app-home-debug.apk"; test -s "$APK"; adb install -r "$APK"; adb shell monkey -p app.mobolauncher.home 1; sleep 8; adb shell dumpsys package app.mobolauncher.home > /tmp/tvgpt-package.txt; grep -E "versionName|versionCode" /tmp/tvgpt-package.txt; adb shell dumpsys activity activities > /tmp/tvgpt-activities.txt; grep -E "app.mobolauncher.home/.MainActivity|ResumedActivity" /tmp/tvgpt-activities.txt'

      - name: Upload verified APKs and reports
        uses: actions/upload-artifact@v4
        with:
          name: tvgpt-android12-verified-apks
          path: |
            app/build/outputs/apk/home/debug/app-home-debug.apk
            app/build/outputs/apk/std/debug/app-std-debug.apk
            reports/
          if-no-files-found: error
          retention-days: 30
