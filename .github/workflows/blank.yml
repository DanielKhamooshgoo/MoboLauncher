name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"
      - name: Inspect APK
        if: always()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "::notice::APK bytes: $(stat -c%s "$APK")"
            echo "::notice::$("$BT"/aapt2 dump badging "$APK" | grep -E 'package:|sdkVersion|targetSdkVersion' | tr '\n' ' ')"
            if "$BT"/zipalign -c 4 "$APK"; then echo "::notice::zipalign ok"; else echo "::warning::zipalign FAILED"; fi
            echo "::notice::$("$BT"/apksigner verify --verbose "$APK" 2>&1 | head -6 | tr '\n' ' ')"
          else
            echo "::error::APK file not found"
          fi
      - name: Report errors
        if: always()
        run: |
          grep -E '^e: |error:|Unresolved reference|Could not resolve|What went wrong' build.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
          exit 0
      - name: Fail if build failed
        if: env.GRADLE_EXIT != '0'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
