name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"
      - name: Report errors
        if: always()
        run: |
          grep -E '^e: |error:|Unresolved reference|Could not resolve|What went wrong' build.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
          exit 0
      - name: Fail if build failed
        if: env.GRADLE_EXIT != '0'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
