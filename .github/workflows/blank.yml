name: Build MoboLauncher GPT APK

on:
  workflow_dispatch:
  push:
    branches: [main, MoboLauncher-gpt]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Validate APK package, SDK, alignment and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "APK_BYTES=$(stat -c%s "$APK")"
          file "$APK"
          unzip -t "$APK" | tail -1
          "$BT/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -E "^(package:|sdkVersion:|targetSdkVersion:)" apk-badging.txt
          "$BT/zipalign" -c 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "APK validation passed."

      - name: Upload GPT APK and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: MoboLauncher-gpt-APK-and-diagnostics
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
          if-no-files-found: error
