name: Build macOS-inspired Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [macos-launcher-rebuild]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Validate APK package, alignment and signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='app.mobolauncher.macos'" apk-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "APK validation passed"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-launcher-rebuild-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
          if-no-files-found: error
